#config-version=FGT200G-7.6.8-FW-build3699-261022:opmode=0:vdom=0:user=secops_admin
config system global
    set hostname "FGT200G-CORP-CORE"
    set admin-sport 8443
    set admin-ssh-port 2222
    set admin-https-redirect disable
    set admintimeout 5
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set strong-crypto enable
    set ssl-static-key-ciphers disable
    set dh-params 8192
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set allow-traffic-redirect disable
    set ipv6-allow-traffic-redirect disable
    set pre-login-banner enable
    set post-login-banner enable
    set private-data-encryption enable
end
config system auto-install
    set auto-install-config disable
    set auto-install-image disable
end
config system password-policy
    set status enable
    set apply-to admin-password ipsec-preshared-key
    set minimum-length 14
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-non-alphanumeric 1
    set min-number 1
    set expire-status enable
    set expire-day 90
    set reuse-password disable
    set reuse-password-limit 5
end
config system admin
    edit "secops_admin"
        set trusthost1 10.99.99.0 255.255.255.0
        set accprofile "super_admin"
        set vdom "root"
        set two-factor fortitoken
        set password ENC PB2x9k4m2p7q8r3w5z
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.20 255.255.255.0
        unset allowaccess
        set role wan
    next
    edit "mgmt"
        set vdom "root"
        set ip 10.99.99.1 255.255.255.0
        set allowaccess https ssh
        set role lan
    next
end
config firewall local-in-policy
    edit 1
        set intf "any"
        set dstaddr "all"
        set internet-service-src enable
        set internet-service-src-name "Malicious-Malicious.Server" "Tor-Exit.Node" "Tor-Relay.Node"
        set service "ALL"
        set schedule "always"
        set action deny
        set logtraffic enable
    next
    edit 2
        set intf "wan1"
        set srcaddr "GEO_TURKEY"
        set dstaddr "all"
        set action accept
        set service "IKE"
        set schedule "always"
        set virtual-patch enable
        set logtraffic enable
    next
end
config firewall DoS-policy
    edit 1
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        config anomaly
            edit "tcp_syn_flood"
                set status enable
                set action block
                set log enable
                set threshold 2000
            next
        end
    next
end
config vpn ssl settings
    set status disable
end
config vpn ipsec phase1-interface
    edit "Dialup_IKEv2_PQC"
        set type dynamic
        set interface "wan1"
        set ike-version 2
        set transport udp-fallback-tcp
        set proposal aes256gcm-prfsha384
        set dhgrp 20 21 14
        set eap enable
    next
end
config vpn ipsec phase2-interface
    edit "Dialup_IKEv2_P2"
        set phase1name "Dialup_IKEv2_PQC"
        set proposal aes256gcm
        set pfs enable
        set dhgrp 20 21
    next
end
config firewall policy
    edit 1
        set name "CORP_LAN_Outbound_HTTPS"
        set srcintf "mgmt"
        set dstintf "wan1"
        set action accept
        set srcaddr "CORP_SUBNET"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS" "DNS"
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set ips-sensor "high_security"
        set av-profile "default"
        set webfilter-profile "default"
        set dnsfilter-profile "default"
        set casb-profile "corporate-saas"
        set dlp-profile "corporate-dlp"
        set logtraffic all
        set nat enable
    next
end
config webfilter fortiguard
    set close-ports enable
end
config log syslogd setting
    set status enable
    set server "10.99.99.50"
    set mode reliable
    set port 6514
    set enc-algorithm high
end
config system ha
    set mode a-p
    set authentication enable
    set encryption enable
end
config system sdwan
    set status enable
    config health-check
        edit "SLA_Cloud_DNS"
            set server "8.8.8.8" "1.1.1.1"
            set protocol ping
        next
    end
end
