#config-version=FGT100F-7.4.3-FW-build2573-240201:opmode=0:vdom=0
config system global
    set hostname "YUKARUC-HQ-FW01"
    set admintimeout 120
    set admin-sport 443
    set admin-ssh-port 22
    set admin-lockout-threshold 5
    set admin-lockout-duration 60
    set pre-login-banner disable
    set strong-crypto disable
end
config system auto-install
    set auto-install-config enable
    set auto-install-image enable
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 212.156.10.2 255.255.255.252
        set role wan
        set allowaccess ping https ssh http fgfm snmp
    next
    edit "lan"
        set vdom "root"
        set ip 10.10.1.1 255.255.255.0
        set role lan
        set allowaccess ping https ssh http telnet
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
    next
    edit "noc_operator"
        set accprofile "super_admin"
    next
end
config system snmp sysinfo
    set status enable
end
config system snmp community
    edit 1
        set name "public"
    next
end
config system ha
    set group-name "HA-CLUSTER"
    set mode a-p
    set authentication disable
    set encryption disable
end
config vpn ssl settings
    set status enable
    set source-interface "wan1"
    set source-address "all"
    set tlsv1-1 enable
    set login-attempt-limit 5
    set login-block-time 30
end
config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
        set web-mode enable
    next
end
config vpn ipsec phase1-interface
    edit "HQ-to-Datacenter"
        set interface "wan1"
        set ike-version 1
        set proposal 3des-sha1 des-md5
        set dhgrp 2
        set npu-offload disable
    next
end
config vpn ipsec phase2-interface
    edit "HQ-to-Datacenter-P2"
        set phase1name "HQ-to-Datacenter"
        set proposal 3des-sha1
        set pfs disable
    next
end
config firewall policy
    edit 1
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set auto-asic-offload disable
        set logtraffic disable
    next
end
