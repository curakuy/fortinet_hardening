#config-version=FGT100F-7.4.7-FW-build2730-250215:opmode=0:vdom=0
config system global
    set hostname "YUKARUC-HARDENED-FW01"
    set admintimeout 5
    set admin-sport 8443
    set admin-ssh-port 2222
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set pre-login-banner enable
    set strong-crypto enable
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
end
config system auto-install
    set auto-install-config disable
    set auto-install-image disable
end
config system password-policy
    set status enable
    set minimum-length 14
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 212.156.10.2 255.255.255.252
        set role wan
    next
    edit "lan"
        set vdom "root"
        set ip 10.10.1.1 255.255.255.0
        set role lan
        set allowaccess ping https ssh
    next
end
config system admin
    edit "sec_netadmin"
        set trusthost1 10.10.1.0 255.255.255.0
        set accprofile "super_admin"
        set two-factor fortitoken
    next
end
config firewall local-in-policy
    edit 1
        set intf "wan1"
        set srcaddr "GEO_TURKEY"
        set dstaddr "all"
        set action accept
        set service "IKE"
        set schedule "always"
    next
end
config firewall DoS-policy
    edit 1
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
    next
end
config system ha
    set group-name "HA-CLUSTER"
    set mode a-p
    set authentication enable
    set encryption enable
end
config vpn ssl settings
    set status disable
end
config vpn ipsec phase1-interface
    edit "HQ-to-Datacenter"
        set interface "wan1"
        set ike-version 2
        set proposal aes256gcm-prfsha384
        set dhgrp 20 19
    next
end
config vpn ipsec phase2-interface
    edit "HQ-to-Datacenter-P2"
        set phase1name "HQ-to-Datacenter"
        set proposal aes256gcm
        set pfs enable
        set dhgrp 20
    next
end
config log syslogd setting
    set status enable
    set server "10.10.1.50"
end
config firewall policy
    edit 1
        set name "LAN_to_Internet_HTTPS"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN_SUBNET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set utm-status enable
        set ips-sensor "high_security"
        set av-profile "default"
        set webfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next
end
